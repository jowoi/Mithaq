name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Clean & Install dependencies (robust)
        run: |
          # remove any lockfile / node_modules remnants, clean npm cache
          rm -rf node_modules package-lock.json npm-shrinkwrap.json
          npm cache clean --force || true

          # try a normal install skipping optional native deps
          if npm install --no-optional --no-audit --no-fund --legacy-peer-deps; then
            echo "npm install succeeded"
          else
            echo "npm install failed — retrying with rebuild..."
            npm install --no-optional --no-audit --no-fund --legacy-peer-deps || true
            npm rebuild --update-binary || true
          fi

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
